<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DAWMS Browser Test Runner (Zero-Sample-Data & Dynamic Onboarding)</title>
  <style>
    body { font-family: monospace; background: #0b0f19; color: #f8fafc; padding: 2rem; }
    .pass { color: #10b981; }
    .fail { color: #f43f5e; font-weight: bold; }
    .suite { font-size: 1.1rem; font-weight: bold; margin-top: 1.5rem; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .test { margin: 6px 0 6px 20px; }
    #summary { margin-top: 2rem; padding: 1rem; border: 1px solid #334155; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>DAWMS Unit Test Suite (Zero-Sample-Data & Dynamic Architecture)</h1>
  <div id="output"></div>
  <div id="summary">Running tests...</div>

  <script src="../js/data.js"></script>
  <script src="../js/workflowEngine.js"></script>
  <script src="../js/allocationEngine.js"></script>

  <script>
    const output = document.getElementById('output');
    const summary = document.getElementById('summary');
    let total = 0;
    let passed = 0;
    let failed = 0;

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Assertion failed');
    }
    assert.strictEqual = (a, b, msg) => {
      if (a !== b) throw new Error(`${msg || 'strictEqual failed'}: expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
    };
    assert.ok = (a, msg) => {
      if (!a) throw new Error(msg || 'assert.ok failed');
    };

    function suite(name, fn) {
      const s = document.createElement('div');
      s.className = 'suite';
      s.textContent = 'Suite: ' + name;
      output.appendChild(s);
      fn();
    }

    function test(name, fn) {
      total++;
      const t = document.createElement('div');
      t.className = 'test';
      try {
        fn();
        passed++;
        t.innerHTML = `<span class="pass">✔</span> ${name}`;
      } catch (err) {
        failed++;
        t.innerHTML = `<span class="fail">✖ ${name}</span><br><pre style="color:#f87171;margin-left:20px;">${err.stack || err.message}</pre>`;
      }
      output.appendChild(t);
    }

    // RUN SUITE 1: AllocationEngine Tests (Zero Data & Dynamic Provisioning)
    suite('AllocationEngine (Zero-Sample-Data & Gale-Shapley Matching)', () => {
      let engine;
      const beforeEach = () => {
        DeptStore.reset();
        engine = new AllocationEngine(DeptStore);
      };

      test('1. should initialize cleanly with zero faculty and zero teams', () => {
        beforeEach();
        const faculty = engine.getFacultyList();
        const teams = engine.getTeams();
        assert.ok(Array.isArray(faculty));
        assert.strictEqual(faculty.length, 0);
        assert.ok(Array.isArray(teams));
        assert.strictEqual(teams.length, 0);
      });

      test('2. should dynamically add faculty members with quota limits', () => {
        beforeEach();
        engine.addFaculty({
          id: 'FAC-DYN-01',
          name: 'Dr. Ramesh Sen',
          role: 'HOD',
          email: 'r.sen@university.edu',
          ugQuotaMax: 3,
          pgQuotaMax: 2
        });
        engine.addFaculty({
          id: 'FAC-DYN-02',
          name: 'Dr. Priya Roy',
          role: 'FACULTY',
          email: 'p.roy@university.edu',
          ugQuotaMax: 2,
          pgQuotaMax: 1
        });
        const faculty = engine.getFacultyList();
        assert.strictEqual(faculty.length, 2);
        assert.strictEqual(engine.getFacultyById('FAC-DYN-01').name, 'Dr. Ramesh Sen');
      });

      test('3. should dynamically register project teams and calculate quotas accurately', () => {
        beforeEach();
        engine.addFaculty({ id: 'FAC-1', name: 'Dr. One', ugQuotaMax: 2, pgQuotaMax: 1 });
        engine.addTeam({
          teamId: 'UG-TEAM-01',
          type: 'UG',
          leadName: 'Student Alpha',
          avgCgpa: 8.8,
          domain: 'Cloud',
          title: 'Cloud Edge',
          preferences: ['FAC-1'],
          allocatedGuideId: 'FAC-1'
        });
        const quotas = engine.calculateQuotas();
        assert.strictEqual(quotas['FAC-1'].ugCurrent, 1);
        assert.strictEqual(quotas['FAC-1'].pgCurrent, 0);
      });

      test('4. should execute automated Gale-Shapley matching respecting merit and capacity constraints', () => {
        beforeEach();
        engine.addFaculty({ id: 'F-GUIDE-A', name: 'Guide A', ugQuotaMax: 1, pgQuotaMax: 1 });
        engine.addFaculty({ id: 'F-GUIDE-B', name: 'Guide B', ugQuotaMax: 2, pgQuotaMax: 1 });

        // Team 1: CGPA 9.5
        engine.addTeam({
          teamId: 'T1',
          type: 'UG',
          leadName: 'Lead 1',
          avgCgpa: 9.5,
          domain: 'AI',
          title: 'Project 1',
          preferences: ['F-GUIDE-A', 'F-GUIDE-B']
        });
        // Team 2: CGPA 8.2
        engine.addTeam({
          teamId: 'T2',
          type: 'UG',
          leadName: 'Lead 2',
          avgCgpa: 8.2,
          domain: 'AI',
          title: 'Project 2',
          preferences: ['F-GUIDE-A', 'F-GUIDE-B']
        });

        const res = engine.runAutomatedMatching();
        assert.strictEqual(res.success, true);

        const updatedT1 = engine.getTeams().find(t => t.teamId === 'T1');
        const updatedT2 = engine.getTeams().find(t => t.teamId === 'T2');
        assert.strictEqual(updatedT1.allocatedGuideId, 'F-GUIDE-A');
        assert.strictEqual(updatedT2.allocatedGuideId, 'F-GUIDE-B');
      });

      test('5. should allow manual override with audit justification', () => {
        beforeEach();
        engine.addFaculty({ id: 'F-A', name: 'Guide A', ugQuotaMax: 2, pgQuotaMax: 1 });
        engine.addFaculty({ id: 'F-B', name: 'Guide B', ugQuotaMax: 2, pgQuotaMax: 1 });
        engine.addTeam({
          teamId: 'TEAM-X',
          type: 'UG',
          leadName: 'Lead X',
          avgCgpa: 8.0,
          domain: 'IoT',
          title: 'IoT Sensors',
          preferences: ['F-A'],
          allocatedGuideId: 'F-A'
        });

        const overridden = engine.manualOverride('TEAM-X', 'F-B', 'Lab hardware requirement', 'Dr. Coordinator');
        assert.strictEqual(overridden.allocatedGuideId, 'F-B');
        assert.strictEqual(overridden.status, 'MANUALLY_ALLOCATED');
        assert.strictEqual(overridden.overrideAudit.by, 'Dr. Coordinator');
      });
    });

    // RUN SUITE 2: WorkflowEngine Tests (Zero Data & Dynamic Lifecycle)
    suite('WorkflowEngine (Zero-Sample-Data & Dynamic Approvals)', () => {
      let engine;
      const beforeEach = () => {
        DeptStore.reset();
        engine = new WorkflowEngine(DeptStore);
      };

      const mockStudent = { id: 'STU-01', name: 'Student Lead', role: 'UG_STUDENT', title: 'Student' };
      const mockGuide = { id: 'FAC-01', name: 'Dr. Guide', role: 'FACULTY', title: 'Faculty Guide' };
      const mockCoord = { id: 'FAC-02', name: 'Dr. Coordinator', role: 'COORDINATOR', title: 'Coordinator' };
      const mockHOD = { id: 'FAC-03', name: 'Prof. HOD', role: 'HOD', title: 'HOD' };

      test('6. should initialize cleanly with zero workflows', () => {
        beforeEach();
        const all = engine.getAll();
        assert.ok(Array.isArray(all));
        assert.strictEqual(all.length, 0);
      });

      test('7. should dynamically create a project proposal with milestones', () => {
        beforeEach();
        const newWf = engine.createWorkflow({
          title: 'Autonomous Robotics with Edge Compute',
          category: 'UG',
          type: 'UG_PROJECT',
          domain: 'Robotics',
          proposedGuideId: 'FAC-01',
          guideName: 'Dr. Guide',
          abstract: 'Edge perception pipeline.'
        }, 'UG_STUDENT', mockStudent);

        assert.ok(newWf.id.startsWith('WF-2026-UG-'));
        assert.strictEqual(newWf.state, 'UNDER_GUIDE_REVIEW');
        assert.strictEqual(newWf.milestones.length, 3);
        assert.strictEqual(engine.getAll().length, 1);
      });

      test('8. should isolate workflow visibility strictly by authenticated role', () => {
        beforeEach();
        const wf = engine.createWorkflow({
          title: 'Quantum Key Distribution',
          category: 'UG',
          type: 'UG_PROJECT',
          domain: 'Quantum',
          proposedGuideId: 'FAC-01',
          guideName: 'Dr. Guide',
          abstract: 'QKD simulation.'
        }, 'UG_STUDENT', mockStudent);

        // HOD sees it
        assert.strictEqual(engine.getByRole('HOD', mockHOD).length, 1);
        // Appointed Guide sees it
        assert.strictEqual(engine.getByRole('FACULTY', mockGuide).length, 1);
        // Submitter sees it
        assert.strictEqual(engine.getByRole('UG_STUDENT', mockStudent).length, 1);
        // Another student DOES NOT see it
        const otherStudent = { id: 'STU-99', name: 'Other', role: 'UG_STUDENT' };
        assert.strictEqual(engine.getByRole('UG_STUDENT', otherStudent).length, 0);
      });

      test('9. should transition workflow through 3-tier approvals to APPROVED', () => {
        beforeEach();
        const wf = engine.createWorkflow({
          title: 'Federated Learning for Healthcare',
          category: 'UG',
          type: 'UG_PROJECT',
          domain: 'AI',
          proposedGuideId: 'FAC-01',
          guideName: 'Dr. Guide',
          abstract: 'Healthcare privacy.'
        }, 'UG_STUDENT', mockStudent);

        // 1. Guide approve
        const s1 = engine.transition(wf.id, 'GUIDE_APPROVE', 'Endorsed.', 'FACULTY', mockGuide);
        assert.strictEqual(s1.state, 'UNDER_COORDINATOR_REVIEW');

        // 2. Coordinator forward
        const s2 = engine.transition(wf.id, 'COORDINATOR_FORWARD', 'Verified.', 'COORDINATOR', mockCoord);
        assert.strictEqual(s2.state, 'UNDER_HOD_REVIEW');

        // 3. HOD sanction
        const s3 = engine.transition(wf.id, 'HOD_APPROVE', 'Sanctioned.', 'HOD', mockHOD);
        assert.strictEqual(s3.state, 'APPROVED');
        assert.ok(s3.sanctionDate);
      });

      test('10. should handle revision request and student resubmission cycle without state reversion', () => {
        beforeEach();
        const wf = engine.createWorkflow({
          title: 'Distributed Consensus on Mobile Mesh',
          category: 'UG',
          type: 'UG_PROJECT',
          domain: 'Networking',
          proposedGuideId: 'FAC-01',
          guideName: 'Dr. Guide',
          abstract: 'Mesh consensus.'
        }, 'UG_STUDENT', mockStudent);

        engine.transition(wf.id, 'GUIDE_APPROVE', 'Endorsed.', 'FACULTY', mockGuide);
        engine.transition(wf.id, 'COORDINATOR_FORWARD', 'Forwarded.', 'COORDINATOR', mockCoord);

        // HOD requests revision
        const rev = engine.transition(wf.id, 'REQUEST_REVISION', 'Elaborate on packet drop test.', 'HOD', mockHOD);
        assert.strictEqual(rev.state, 'REVISION_REQUESTED');

        // Student resubmits
        const resubmitted = engine.transition(wf.id, 'STUDENT_RESUBMIT', 'Added packet loss simulation benchmarks.', 'UG_STUDENT', mockStudent);
        assert.strictEqual(resubmitted.state, 'UNDER_GUIDE_REVIEW');
      });

      test('11. should evaluate continuous assessment rubrics with ABET 3-part criteria and calculate grade', () => {
        beforeEach();
        const wf = engine.createWorkflow({
          title: 'Secure Enclaves on RISC-V',
          category: 'UG',
          type: 'UG_PROJECT',
          domain: 'Hardware Security',
          proposedGuideId: 'FAC-01',
          guideName: 'Dr. Guide',
          abstract: 'TEE implementation.'
        }, 'UG_STUDENT', mockStudent);

        const rubric = { literatureSurvey: 28, rigorAndMath: 38, oralDefense: 28 };
        const evaluated = engine.evaluateMilestone(wf.id, 'M1', rubric, 'Excellent hardware benchmarks.', mockGuide);

        assert.strictEqual(evaluated.status, 'EVALUATED');
        assert.strictEqual(evaluated.score, 94);
        assert.strictEqual(evaluated.grade, 'O');
      });
    });

    summary.innerHTML = `<strong>Result:</strong> ${passed} / ${total} tests PASSED (${failed} failed)`;
    if (failed === 0) {
      summary.style.borderColor = '#10b981';
      summary.style.color = '#10b981';
    } else {
      summary.style.borderColor = '#f43f5e';
      summary.style.color = '#f43f5e';
    }
  </script>
</body>
</html>
