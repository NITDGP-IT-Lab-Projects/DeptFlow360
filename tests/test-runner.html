<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DAWMS Browser Test Runner</title>
  <style>
    body { font-family: monospace; background: #0b0f19; color: #f8fafc; padding: 2rem; }
    .pass { color: #10b981; }
    .fail { color: #f43f5e; font-weight: bold; }
    .suite { font-size: 1.1rem; font-weight: bold; margin-top: 1.5rem; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .test { margin: 6px 0 6px 20px; }
    #summary { margin-top: 2rem; padding: 1rem; border: 1px solid #334155; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>DAWMS Unit Test Suite Execution</h1>
  <div id="output"></div>
  <div id="summary">Running tests...</div>

  <script src="../js/data.js"></script>
  <script src="../js/workflowEngine.js"></script>
  <script src="../js/allocationEngine.js"></script>

  <script>
    const output = document.getElementById('output');
    const summary = document.getElementById('summary');
    let total = 0;
    let passed = 0;
    let failed = 0;

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Assertion failed');
    }
    assert.strictEqual = (a, b, msg) => {
      if (a !== b) throw new Error(`${msg || 'strictEqual failed'}: expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
    };
    assert.ok = (a, msg) => {
      if (!a) throw new Error(msg || 'assert.ok failed');
    };

    function suite(name, fn) {
      const s = document.createElement('div');
      s.className = 'suite';
      s.textContent = 'Suite: ' + name;
      output.appendChild(s);
      fn();
    }

    function test(name, fn) {
      total++;
      const t = document.createElement('div');
      t.className = 'test';
      try {
        fn();
        passed++;
        t.innerHTML = `<span class="pass">✔</span> ${name}`;
      } catch (err) {
        failed++;
        t.innerHTML = `<span class="fail">✖ ${name}</span><br><pre style="color:#f87171;margin-left:20px;">${err.stack || err.message}</pre>`;
      }
      output.appendChild(t);
    }

    // RUN SUITE 1: AllocationEngine Tests
    suite('AllocationEngine Tests', () => {
      let engine;
      const beforeEach = () => {
        DeptStore.reset();
        engine = new AllocationEngine(DeptStore);
      };

      test('1. should initialize with faculty quotas and project teams', () => {
        beforeEach();
        const faculty = engine.getFacultyList();
        const teams = engine.getTeams();
        assert.ok(Array.isArray(faculty));
        assert.strictEqual(faculty.length, 5);
        assert.ok(Array.isArray(teams));
        assert.strictEqual(teams.length, 8);
      });

      test('2. should calculate live quotas accurately based on assignments', () => {
        beforeEach();
        const quotas = engine.calculateQuotas();
        assert.ok(quotas['FAC-01']);
        assert.ok(quotas['FAC-02']);
        assert.ok(quotas['FAC-03']);
        const teams = engine.getTeams();
        const fac3UgTeams = teams.filter(t => t.allocatedGuideId === 'FAC-03' && t.type === 'UG').length;
        assert.strictEqual(quotas['FAC-03'].ugCurrent, fac3UgTeams);
      });

      test('3. should execute automated Gale-Shapley matching without exceeding faculty quotas', () => {
        beforeEach();
        const result = engine.runAutomatedMatching();
        assert.strictEqual(result.success, true);
        assert.ok(Array.isArray(result.logs));
        assert.ok(result.logs.length > 0);
        const updatedTeams = engine.getTeams();
        const faculty = engine.getFacultyList();
        updatedTeams.forEach(team => {
          assert.ok(team.allocatedGuideId !== null, `Team ${team.teamId} should be allocated a guide`);
          assert.strictEqual(team.status, 'ALLOCATED');
        });
        const quotaMap = engine.calculateQuotas();
        faculty.forEach(f => {
          assert.ok(quotaMap[f.id].ugCurrent <= f.ugQuotaMax);
          assert.ok(quotaMap[f.id].pgCurrent <= f.pgQuotaMax);
        });
      });

      test('4. should allow coordinator/HOD to execute manual override with audit justification', () => {
        beforeEach();
        const targetTeamId = 'UG-TEAM-05';
        const newFacultyId = 'FAC-05';
        const reason = 'Special embedded hardware requirement verified by coordinator.';
        const actorName = 'Dr. Ananya Roy';
        const overridden = engine.manualOverride(targetTeamId, newFacultyId, reason, actorName);
        assert.strictEqual(overridden.allocatedGuideId, newFacultyId);
        assert.strictEqual(overridden.status, 'MANUALLY_ALLOCATED');
        assert.ok(overridden.overrideAudit);
        assert.strictEqual(overridden.overrideAudit.by, actorName);
        assert.strictEqual(overridden.overrideAudit.reason, reason);
      });

      test('5. should revert to default allocations upon reset', () => {
        beforeEach();
        engine.runAutomatedMatching();
        engine.resetAllocations();
        const teams = engine.getTeams();
        const unallocated = teams.find(t => t.teamId === 'UG-TEAM-05');
        assert.strictEqual(unallocated.allocatedGuideId, null);
        assert.strictEqual(unallocated.status, 'UNALLOCATED');
      });
    });

    // RUN SUITE 2: WorkflowEngine Tests
    suite('WorkflowEngine Tests', () => {
      let engine;
      const beforeEach = () => {
        DeptStore.reset();
        engine = new WorkflowEngine(DeptStore);
      };

      test('6. should initialize with baseline workflows', () => {
        beforeEach();
        const all = engine.getAll();
        assert.ok(Array.isArray(all));
        assert.ok(all.length >= 4);
        assert.ok(engine.getById('WF-2026-UG-04') !== null);
      });

      test('7. should filter workflows accurately by role', () => {
        beforeEach();
        const hodItems = engine.getByRole('HOD', INITIAL_ROLES.HOD);
        assert.strictEqual(hodItems.length, engine.getAll().length);
        const facItems = engine.getByRole('FACULTY', INITIAL_ROLES.FACULTY);
        assert.ok(Array.isArray(facItems));
        const ugItems = engine.getByRole('UG_STUDENT', INITIAL_ROLES.UG_STUDENT);
        assert.ok(ugItems.length > 0);
      });

      test('8. should return valid available actions based on RBAC and state', () => {
        beforeEach();
        const wf = engine.getById('WF-2026-UG-04');
        assert.strictEqual(wf.state, 'UNDER_HOD_REVIEW');
        const hodActions = engine.getAvailableActions(wf, 'HOD', INITIAL_ROLES.HOD);
        const hodKeys = hodActions.map(a => a.key);
        assert.ok(hodKeys.includes('HOD_APPROVE'));
        assert.ok(hodKeys.includes('REQUEST_REVISION'));
        assert.ok(hodKeys.includes('REJECT'));
        const studentActions = engine.getAvailableActions(wf, 'UG_STUDENT', INITIAL_ROLES.UG_STUDENT);
        assert.strictEqual(studentActions.length, 0);
      });

      test('9. should transition state on HOD approval and log audit record', () => {
        beforeEach();
        const wfId = 'WF-2026-UG-04';
        const updated = engine.transition(wfId, 'HOD_APPROVE', 'Approved project.', 'HOD', INITIAL_ROLES.HOD);
        assert.strictEqual(updated.state, 'APPROVED');
        const latestAudit = updated.history[updated.history.length - 1];
        assert.strictEqual(latestAudit.action, 'HOD_SANCTIONED');
      });

      test('10. should handle revision request and student resubmission cycle', () => {
        beforeEach();
        const wfId = 'WF-2026-UG-04';
        const revWf = engine.transition(wfId, 'REQUEST_REVISION', 'Refine section 3.', 'HOD', INITIAL_ROLES.HOD);
        assert.strictEqual(revWf.state, 'REVISION_REQUESTED');
        
        // Student should have STUDENT_RESUBMIT available
        const studentActions = engine.getAvailableActions(revWf, 'UG_STUDENT', INITIAL_ROLES.UG_STUDENT);
        assert.ok(studentActions.some(a => a.key === 'STUDENT_RESUBMIT' || a.key === 'RESUBMIT'));

        const resubmittedWf = engine.transition(wfId, 'STUDENT_RESUBMIT', 'Updated section 3.', 'UG_STUDENT', INITIAL_ROLES.UG_STUDENT);
        assert.strictEqual(resubmittedWf.state, 'UNDER_GUIDE_REVIEW');
      });

      test('11. should allow creation of new workflow items', () => {
        beforeEach();
        const initialCount = engine.getAll().length;
        const payload = {
          title: 'Quantum Key Distribution over Free-Space Optical Channels',
          category: 'UG',
          type: 'UG_PROJECT',
          domain: 'Quantum Computing',
          abstract: 'Investigating entanglement-based QKD protocol simulation.',
          proposedGuideId: 'FAC-03',
          teamMembers: ['Rahul Verma', 'Priya Sharma']
        };
        const newWf = engine.createWorkflow(payload, 'UG_STUDENT', INITIAL_ROLES.UG_STUDENT);
        assert.ok(newWf.id.startsWith('WF-2026-UG-'));
        assert.strictEqual(newWf.state, 'UNDER_GUIDE_REVIEW');
        assert.strictEqual(engine.getAll().length, initialCount + 1);
      });

      test('12. should evaluate milestone rubrics and calculate total score', () => {
        beforeEach();
        const wf = engine.getById('WF-2026-UG-04');
        const rubricScores = { literatureSurvey: 27, rigorAndMath: 36, oralDefense: 28 };
        const evaluated = engine.evaluateMilestone(wf.id, 'M1', rubricScores, 'Solid literature coverage.', INITIAL_ROLES.FACULTY);
        assert.strictEqual(evaluated.status, 'EVALUATED');
        assert.strictEqual(evaluated.score, 91);
      });

      test('13. should generate notifications and support mark-as-read', () => {
        beforeEach();
        const notifs = engine.getNotifications('HOD');
        assert.ok(notifs.length > 0);
        engine.markAllNotificationsRead();
        const updated = engine.getNotifications('HOD');
        updated.forEach(n => assert.strictEqual(n.read, true));
      });

      test('14. should ensure WF-2026-NOC-12 is supervised and reviewable by Guide Dr. Vikramaditya Das', () => {
        beforeEach();
        const nocWf = engine.getById('WF-2026-NOC-12');
        assert.ok(nocWf, 'NOC-12 should exist');
        assert.strictEqual(nocWf.state, 'UNDER_GUIDE_REVIEW');
        assert.strictEqual(nocWf.details.proposedGuideId, 'FAC-03');
        assert.strictEqual(nocWf.details.allocatedGuideId, 'FAC-03');

        // Check Guide available actions
        const guideActions = engine.getAvailableActions(nocWf, 'FACULTY', INITIAL_ROLES.FACULTY);
        const actionKeys = guideActions.map(a => a.key);
        assert.ok(actionKeys.includes('GUIDE_ENDORSE'), 'Guide should have GUIDE_ENDORSE');
        assert.ok(actionKeys.includes('REQUEST_REVISION'), 'Guide should have REQUEST_REVISION');
        assert.ok(actionKeys.includes('REJECT'), 'Guide should have REJECT');

        // Guide endorses NOC
        const endorsedWf = engine.transition('WF-2026-NOC-12', 'GUIDE_ENDORSE', 'Endorsed internship research alignment.', 'FACULTY', INITIAL_ROLES.FACULTY);
        assert.strictEqual(endorsedWf.state, 'UNDER_COORDINATOR_REVIEW');
      });
    });

    summary.innerHTML = `<strong>Result:</strong> ${passed} / ${total} tests PASSED (${failed} failed)`;
    if (failed === 0) {
      summary.style.borderColor = '#10b981';
      summary.style.color = '#10b981';
    } else {
      summary.style.borderColor = '#f43f5e';
      summary.style.color = '#f43f5e';
    }
  </script>
</body>
</html>
