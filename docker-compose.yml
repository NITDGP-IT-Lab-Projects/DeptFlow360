services:
  # ============================================================================
  # Local MongoDB Service (Ensures self-contained container stack in CI & local)
  # ============================================================================
  mongodb:
    image: mongo:6.0
    container_name: deptflow-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  # ============================================================================
  # Express Backend API Service (Connects to MongoDB Atlas or local container)
  # ============================================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: deptflow-backend:latest
    container_name: deptflow-backend
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/deptflow360}
      - PORT=5000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      - mongodb
    restart: unless-stopped

  # ============================================================================
  # Nginx Frontend Web Server & Reverse Proxy
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: deptflow-frontend:latest
    container_name: deptflow-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mongo-data:
