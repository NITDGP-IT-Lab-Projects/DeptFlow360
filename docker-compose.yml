version: '3.8'

services:
  deptflow360:
    build:
      context: .
      dockerfile: Dockerfile
    image: deptflow360:latest
    container_name: deptflow360-app
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
