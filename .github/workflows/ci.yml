name: DeptFlow 360 CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Static Asset, Syntax & Unit Test Matrix
  # ============================================================================
  test-and-lint:
    name: Unit Tests & Code Integrity (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Frontend Dependencies
        run: npm install

      - name: Install Backend Dependencies
        run: |
          cd server
          npm install

      - name: Validate Syntax & Static Asset Integrity
        run: npm run test:syntax

      - name: Run Core Logic Unit Tests (Workflow & Allocation Engines)
        run: npm test

      - name: Build React Production SPA Bundle
        run: npm run build

  # ============================================================================
  # JOB 2: Docker Build & Live Container Health Check
  # ============================================================================
  docker-validation:
    name: Docker Build & Live Health Check
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Launch Application Stack via Docker Compose
        run: |
          docker compose up -d --build
          sleep 5

      - name: Verify Frontend Web Server Health (/healthz)
        run: |
          echo "Probing container health endpoint..."
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors --retry-connrefused http://localhost:8080/healthz

      - name: Verify Backend API Reverse Proxy (/api/health)
        run: |
          echo "Probing backend API health endpoint through Nginx..."
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors --retry-connrefused http://localhost:8080/api/health

      - name: Verify Application Serves HTTP 200 & Correct Content
        run: |
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Expected HTTP 200, but got $RESPONSE_CODE"
            exit 1
          fi
          echo "HTTP 200 OK verified."

          # Verify Branding Title in Payload
          curl -s http://localhost:8080/ | grep -q "DeptFlow 360"
          echo "DeptFlow 360 branding verified in response payload."

      - name: Validate Nginx Security Headers
        run: |
          HEADERS=$(curl -sI http://localhost:8080/)
          echo "Received Headers:"
          echo "$HEADERS"
          echo "$HEADERS" | grep -iq "X-Frame-Options: SAMEORIGIN"
          echo "$HEADERS" | grep -iq "X-Content-Type-Options: nosniff"
          echo "Nginx security headers confirmed."

      - name: Validate Zero-Sample-Data Baseline & Live Dynamic Data Onboarding
        run: |
          echo "============================================================================"
          echo "1. Verify initial clean slate (zero mock workflows in system)..."
          echo "============================================================================"
          WF_RES=$(curl -s http://localhost:8080/api/workflows)
          echo "$WF_RES" | grep -q '"success":true'
          echo "Clean slate response: $WF_RES"

          echo "============================================================================"
          echo "2. Dynamically register users with bcrypt hashed passwords..."
          echo "============================================================================"
          # 2a. Student User
          STU_RES=$(curl -s -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"name":"Aritra Sen","email":"aritra.sen@nitdgp.ac.in","password":"PassStudent@123","role":"UG_STUDENT","designation":"B.Tech Scholar"}')
          echo "$STU_RES" | grep -q "token"
          echo "Student user signed up successfully."

          # 2b. Faculty Guide User
          FAC_SIGNUP_RES=$(curl -s -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"name":"Dr. Subhankar Ghosh","email":"s.ghosh@nitdgp.ac.in","password":"PassGuide@123","role":"FACULTY","designation":"Associate Professor"}')
          echo "$FAC_SIGNUP_RES" | grep -q "token"
          echo "Faculty Guide signed up successfully."

          # 2c. Coordinator User
          COORD_RES=$(curl -s -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"name":"Dr. Tanmay Roy","email":"t.roy@nitdgp.ac.in","password":"PassCoord@123","role":"COORDINATOR","designation":"UG Project Coordinator"}')
          echo "$COORD_RES" | grep -q "token"
          echo "Coordinator signed up successfully."

          # 2d. HOD User
          HOD_RES=$(curl -s -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"name":"Prof. Nirmal Kumar","email":"hod.it@nitdgp.ac.in","password":"PassHod@123","role":"HOD","designation":"Head of Department"}')
          echo "$HOD_RES" | grep -q "token"
          echo "HOD signed up successfully."

          echo "============================================================================"
          echo "3. Test Authentication & Password Hashing Verification..."
          echo "============================================================================"
          # Incorrect password attempt -> MUST fail with 401 Unauthorized
          FAIL_LOGIN=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"email":"aritra.sen@nitdgp.ac.in","password":"WRONG_PASSWORD"}')
          if [ "$FAIL_LOGIN" -ne 401 ]; then
            echo "Expected HTTP 401 for invalid credentials, but got $FAIL_LOGIN!"
            exit 1
          fi
          echo "Invalid password correctly rejected with HTTP 401."

          # Correct password attempt -> MUST succeed with HTTP 200 & JWT token
          LOGIN_RES=$(curl -s -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"email":"aritra.sen@nitdgp.ac.in","password":"PassStudent@123"}')
          echo "$LOGIN_RES" | grep -q "token"
          echo "Valid password authenticated and JWT token issued successfully via /signin."

          # Verify /login endpoint alias also works seamlessly
          LOGIN_ALIAS_RES=$(curl -s -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"aritra.sen@nitdgp.ac.in","password":"PassStudent@123"}')
          echo "$LOGIN_ALIAS_RES" | grep -q "token"
          echo "Valid password authenticated via /login alias as well."

          echo "============================================================================"
          echo "4. Dynamically provision faculty member with supervisory quotas..."
          echo "============================================================================"
          FAC_RES=$(curl -s -X POST http://localhost:8080/api/faculty \
            -H "Content-Type: application/json" \
            -d '{"id":"FAC-SG","name":"Dr. Subhankar Ghosh","email":"s.ghosh@nitdgp.ac.in","role":"FACULTY","designation":"Associate Professor","ugQuotaMax":3,"pgQuotaMax":2,"specializations":["Computer Networks","IoT"]}')
          echo "Response: $FAC_RES"
          echo "$FAC_RES" | grep -q '"success":true'
          echo "Faculty supervisor provisioned successfully."

          echo "============================================================================"
          echo "5. Dynamically register capstone project team..."
          echo "============================================================================"
          TEAM_RES=$(curl -s -X POST http://localhost:8080/api/allocation/teams \
            -H "Content-Type: application/json" \
            -d '{"teamId":"UG-2026-T01","title":"LoRaWAN Sensor Mesh for Smart Agriculture","leadName":"Aritra Sen","avgCgpa":8.95,"domain":"IoT & Edge Computing","type":"UG","preferences":["FAC-SG"]}')
          echo "Response: $TEAM_RES"
          echo "$TEAM_RES" | grep -q '"success":true'
          echo "Project team registered successfully."

          echo "============================================================================"
          echo "6. Run Gale-Shapley matching simulation..."
          echo "============================================================================"
          MATCH_RES=$(curl -s -X POST http://localhost:8080/api/allocation/match)
          echo "Response: $MATCH_RES"
          echo "$MATCH_RES" | grep -q '"success":true'
          echo "Gale-Shapley matching executed successfully."

          echo "============================================================================"
          echo "7. Dynamically submit student capstone proposal..."
          echo "============================================================================"
          WF_SUBMIT=$(curl -s -X POST http://localhost:8080/api/workflows \
            -H "Content-Type: application/json" \
            -d '{"title":"LoRaWAN Sensor Mesh for Smart Agriculture","category":"UG","type":"UG_PROJECT","domain":"IoT & Edge Computing","abstract":"Dynamic deployment of low-power sensor nodes.","proposedGuideId":"FAC-SG","actorRole":"UG_STUDENT","actorData":{"id":"STU-01","name":"Aritra Sen","title":"UG Student"}}')
          echo "Response: $WF_SUBMIT"
          echo "$WF_SUBMIT" | grep -q '"success":true'
          WF_ID=$(echo "$WF_SUBMIT" | grep -o '"id":"[^"]*' | head -1 | cut -d'"' -f4)
          echo "Dynamic proposal created with ID: $WF_ID"

          echo "============================================================================"
          echo "8. Execute Full Multi-Stage Workflow Transitions & Revision Loop..."
          echo "============================================================================"
          # 8a. Guide Endorses
          S1=$(curl -s -X POST "http://localhost:8080/api/workflows/$WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"GUIDE_ENDORSE","comment":"Endorsed with strong IoT merit.","actorRole":"FACULTY","actorName":"Dr. Subhankar Ghosh","actorId":"FAC-SG"}')
          echo "Stage 1 Response: $S1"
          echo "$S1" | grep -q "UNDER_COORDINATOR_REVIEW"
          echo "Stage 1: Guide endorsed -> UNDER_COORDINATOR_REVIEW"

          # 8b. Coordinator Verifies & Forwards to HOD
          S2=$(curl -s -X POST "http://localhost:8080/api/workflows/$WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"COORDINATOR_VERIFY","comment":"Verified quota and hardware resources.","actorRole":"COORDINATOR","actorName":"Dr. Tanmay Roy","actorId":"COORD-01"}')
          echo "Stage 2 Response: $S2"
          echo "$S2" | grep -q "UNDER_HOD_REVIEW"
          echo "Stage 2: Coordinator verified -> UNDER_HOD_REVIEW"

          # 8c. HOD Requests Revision
          S3=$(curl -s -X POST "http://localhost:8080/api/workflows/$WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"REQUEST_REVISION","comment":"Please elaborate on solar power budget analysis.","actorRole":"HOD","actorName":"Prof. Nirmal Kumar","actorId":"HOD-01"}')
          echo "Stage 3 Response: $S3"
          echo "$S3" | grep -q "REVISION_REQUESTED"
          echo "Stage 3: HOD requested revision -> REVISION_REQUESTED"

          # 8d. Student Resubmits Revised Proposal
          S4=$(curl -s -X POST "http://localhost:8080/api/workflows/$WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"STUDENT_RESUBMIT","comment":"Added Section 4 with comprehensive solar irradiance calculation.","actorRole":"UG_STUDENT","actorName":"Aritra Sen","actorId":"STU-01"}')
          echo "Stage 4 Response: $S4"
          echo "$S4" | grep -q "UNDER_GUIDE_REVIEW"
          echo "$S4" | grep -q "REVISION_SUBMITTED"
          echo "Stage 4: Student resubmitted -> UNDER_GUIDE_REVIEW (action REVISION_SUBMITTED recorded)"

          # 8e. Guide Re-endorses
          S5=$(curl -s -X POST "http://localhost:8080/api/workflows/$WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"GUIDE_ENDORSE","comment":"Revisions verified and satisfactory.","actorRole":"FACULTY","actorName":"Dr. Subhankar Ghosh","actorId":"FAC-SG"}')
          echo "Stage 5 Response: $S5"
          echo "$S5" | grep -q "UNDER_COORDINATOR_REVIEW"

          # 8f. Coordinator Re-forwards
          S6=$(curl -s -X POST "http://localhost:8080/api/workflows/$WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"COORDINATOR_VERIFY","comment":"Forwarded to HOD for sanction.","actorRole":"COORDINATOR","actorName":"Dr. Tanmay Roy","actorId":"COORD-01"}')
          echo "Stage 6 Response: $S6"
          echo "$S6" | grep -q "UNDER_HOD_REVIEW"

          # 8g. HOD Grants Final Sanction
          S7=$(curl -s -X POST "http://localhost:8080/api/workflows/$WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"HOD_APPROVE","comment":"Approved and officially sanctioned for implementation.","actorRole":"HOD","actorName":"Prof. Nirmal Kumar","actorId":"HOD-01"}')
          echo "Stage 7 Response: $S7"
          echo "$S7" | grep -q "APPROVED"
          echo "Stage 7: Final Sanction Granted -> APPROVED"

          echo "============================================================================"
          echo "9. Continuous Assessment: Milestone Rubric Evaluation..."
          echo "============================================================================"
          RUBRIC_RES=$(curl -s -X POST "http://localhost:8080/api/workflows/$WF_ID/milestones/M1/evaluate" \
            -H "Content-Type: application/json" \
            -d '{"rubricScores":{"literatureSurvey":28,"rigorAndMath":36,"presentation":27},"feedback":"Outstanding literature survey with clear methodology.","evaluatorData":{"id":"FAC-SG","name":"Dr. Subhankar Ghosh"}}')
          echo "Rubric Response: $RUBRIC_RES"
          echo "$RUBRIC_RES" | grep -q '"success":true'
          echo "Milestone 1 evaluated with 3-part rubric scoring."

          echo "============================================================================"
          echo "10. Sequential Review Hierarchy Enforcement (Negative Testing via Nginx)..."
          echo "============================================================================"
          # 10a. Submit a fresh proposal for hierarchy negative tests
          NEG_SUBMIT=$(curl -s -X POST http://localhost:8080/api/workflows \
            -H "Content-Type: application/json" \
            -d '{"title":"Post-Quantum Lattice Signature Scheme","category":"UG","type":"UG_PROJECT","domain":"Cryptography","abstract":"Implementation of Dilithium.","proposedGuideId":"FAC-SG","actorRole":"UG_STUDENT","actorData":{"id":"STU-01","name":"Aritra Sen","title":"UG Student"}}')
          echo "NegSubmit Response: $NEG_SUBMIT"
          echo "$NEG_SUBMIT" | grep -q '"success":true'
          NEG_WF_ID=$(echo "$NEG_SUBMIT" | grep -o '"id":"[^"]*' | head -1 | cut -d'"' -f4)
          echo "Hierarchy test proposal created with ID: $NEG_WF_ID"

          # 10b. Test: Coordinator CANNOT review before Guide endorses -> MUST return HTTP 400
          COORD_PREMATURE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/workflows/$NEG_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"COORDINATOR_VERIFY","comment":"Premature coordinator review","actorRole":"COORDINATOR","actorName":"Dr. Tanmay Roy","actorId":"COORD-01"}')
          if [ "$COORD_PREMATURE_CODE" -ne 400 ]; then
            echo "Expected HTTP 400 for Coordinator premature review, but got $COORD_PREMATURE_CODE!"
            exit 1
          fi
          echo "Coordinator premature review correctly blocked with HTTP 400."

          # 10c. Test: HOD CANNOT review before Guide and Coordinator review -> MUST return HTTP 400
          HOD_PREMATURE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/workflows/$NEG_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"HOD_APPROVE","comment":"Premature HOD sanction","actorRole":"HOD","actorName":"Prof. Nirmal Kumar","actorId":"HOD-01"}')
          if [ "$HOD_PREMATURE_CODE" -ne 400 ]; then
            echo "Expected HTTP 400 for HOD premature sanction, but got $HOD_PREMATURE_CODE!"
            exit 1
          fi
          echo "HOD premature sanction on UNDER_GUIDE_REVIEW correctly blocked with HTTP 400."

          # 10d. Test: HOD CANNOT request revision before Guide and Coordinator review -> MUST return HTTP 400
          HOD_PREMATURE_REV_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/workflows/$NEG_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"REQUEST_REVISION","comment":"Premature HOD revision request","actorRole":"HOD","actorName":"Prof. Nirmal Kumar","actorId":"HOD-01"}')
          if [ "$HOD_PREMATURE_REV_CODE" -ne 400 ]; then
            echo "Expected HTTP 400 for HOD premature revision request, but got $HOD_PREMATURE_REV_CODE!"
            exit 1
          fi
          echo "HOD premature revision request correctly blocked with HTTP 400."

          # 10e. Guide legitimately endorses proposal -> moves to UNDER_COORDINATOR_REVIEW
          GUIDE_LEGIT_RES=$(curl -s -X POST "http://localhost:8080/api/workflows/$NEG_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"GUIDE_ENDORSE","comment":"Endorsed by faculty guide.","actorRole":"FACULTY","actorName":"Dr. Subhankar Ghosh","actorId":"FAC-SG"}')
          echo "$GUIDE_LEGIT_RES" | grep -q "UNDER_COORDINATOR_REVIEW"
          echo "Guide legitimately endorsed -> proposal is now in UNDER_COORDINATOR_REVIEW."

          # 10f. Test: HOD CANNOT review before Coordinator verification -> MUST return HTTP 400
          HOD_PREMATURE_COORD_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/workflows/$NEG_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"HOD_APPROVE","comment":"Premature HOD sanction before coordinator","actorRole":"HOD","actorName":"Prof. Nirmal Kumar","actorId":"HOD-01"}')
          if [ "$HOD_PREMATURE_COORD_CODE" -ne 400 ]; then
            echo "Expected HTTP 400 for HOD premature sanction before Coordinator verification, but got $HOD_PREMATURE_COORD_CODE!"
            exit 1
          fi
          echo "HOD premature sanction on UNDER_COORDINATOR_REVIEW correctly blocked with HTTP 400."

          # 10g. Coordinator legitimately verifies -> moves to UNDER_HOD_REVIEW
          COORD_LEGIT_RES=$(curl -s -X POST "http://localhost:8080/api/workflows/$NEG_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"COORDINATOR_VERIFY","comment":"Verified quotas and academic merit.","actorRole":"COORDINATOR","actorName":"Dr. Tanmay Roy","actorId":"COORD-01"}')
          echo "$COORD_LEGIT_RES" | grep -q "UNDER_HOD_REVIEW"
          echo "Coordinator legitimately verified -> proposal is now in UNDER_HOD_REVIEW."

          # 10h. HOD legitimately sanctions -> moves to APPROVED
          HOD_LEGIT_RES=$(curl -s -X POST "http://localhost:8080/api/workflows/$NEG_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"HOD_APPROVE","comment":"Final HOD sanction approved.","actorRole":"HOD","actorName":"Prof. Nirmal Kumar","actorId":"HOD-01"}')
          echo "$HOD_LEGIT_RES" | grep -q "APPROVED"
          echo "HOD legitimately sanctioned -> proposal is now APPROVED."

          # 10i. Test: Re-sanctioning an already APPROVED proposal -> MUST return HTTP 400
          RE_SANCTION_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/workflows/$NEG_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"HOD_APPROVE","comment":"Re-sanction attempt","actorRole":"HOD","actorName":"Prof. Nirmal Kumar","actorId":"HOD-01"}')
          if [ "$RE_SANCTION_CODE" -ne 400 ]; then
            echo "Expected HTTP 400 for re-sanction of APPROVED proposal, but got $RE_SANCTION_CODE!"
            exit 1
          fi
          echo "Re-sanction of APPROVED proposal correctly rejected with HTTP 400."

          # 10j. Test: Resubmission on an APPROVED proposal -> MUST return HTTP 400
          RESUBMIT_APPROVED_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/workflows/$NEG_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"STUDENT_RESUBMIT","comment":"Attempt resubmission of approved proposal","actorRole":"UG_STUDENT","actorName":"Aritra Sen","actorId":"STU-01"}')
          if [ "$RESUBMIT_APPROVED_CODE" -ne 400 ]; then
            echo "Expected HTTP 400 for resubmission on APPROVED proposal, but got $RESUBMIT_APPROVED_CODE!"
            exit 1
          fi
          echo "Resubmission on APPROVED proposal correctly rejected with HTTP 400."

          # 10k. Test: Coordinator CANNOT endorse on behalf of Guide -> MUST return HTTP 400
          FRESH_PROP=$(curl -s -X POST http://localhost:8080/api/workflows \
            -H "Content-Type: application/json" \
            -d '{"title":"Quantum Key Distribution Network","category":"UG","type":"UG_PROJECT","domain":"Cryptography","abstract":"QKD implementation.","proposedGuideId":"FAC-SG","actorRole":"UG_STUDENT","actorData":{"id":"STU-01","name":"Aritra Sen","title":"UG Student"}}')
          FRESH_WF_ID=$(echo "$FRESH_PROP" | grep -o '"id":"[^"]*' | head -1 | cut -d'"' -f4)
          
          COORD_ENDORSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/workflows/$FRESH_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"GUIDE_ENDORSE","comment":"Coordinator attempts to endorse","actorRole":"COORDINATOR","actorName":"Dr. Tanmay Roy","actorId":"COORD-01"}')
          if [ "$COORD_ENDORSE_CODE" -ne 400 ]; then
            echo "Expected HTTP 400 for Coordinator attempting GUIDE_ENDORSE, but got $COORD_ENDORSE_CODE!"
            exit 1
          fi
          echo "Coordinator attempting GUIDE_ENDORSE correctly blocked with HTTP 400."

          # 10l. Test: Coordinator CANNOT expedite past Guide review -> MUST return HTTP 400
          COORD_EXPEDITE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/workflows/$FRESH_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"COORDINATOR_EXPEDITE","comment":"Coordinator attempts to expedite past guide","actorRole":"COORDINATOR","actorName":"Dr. Tanmay Roy","actorId":"COORD-01"}')
          if [ "$COORD_EXPEDITE_CODE" -ne 400 ]; then
            echo "Expected HTTP 400 for Coordinator attempting COORDINATOR_EXPEDITE, but got $COORD_EXPEDITE_CODE!"
            exit 1
          fi
          echo "Coordinator attempting COORDINATOR_EXPEDITE correctly blocked with HTTP 400."

          # 10m. Test: Coordinator CANNOT reject on UNDER_GUIDE_REVIEW -> MUST return HTTP 400
          COORD_REJECT_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/workflows/$FRESH_WF_ID/transition" \
            -H "Content-Type: application/json" \
            -d '{"actionKey":"REJECT","comment":"Coordinator attempts premature reject","actorRole":"COORDINATOR","actorName":"Dr. Tanmay Roy","actorId":"COORD-01"}')
          if [ "$COORD_REJECT_CODE" -ne 400 ]; then
            echo "Expected HTTP 400 for Coordinator attempting REJECT on UNDER_GUIDE_REVIEW, but got $COORD_REJECT_CODE!"
            exit 1
          fi
          echo "Coordinator attempting premature REJECT correctly blocked with HTTP 400."

          # 10n. Test: Departmental proposals MUST start in UNDER_GUIDE_REVIEW
          DEPT_PROP=$(curl -s -X POST http://localhost:8080/api/workflows \
            -H "Content-Type: application/json" \
            -d '{"title":"Server Blade Requisition","category":"DEPARTMENTAL","type":"LAB_EQUIPMENT","domain":"Infrastructure","abstract":"Server hardware requisition.","proposedGuideId":"FAC-SG","actorRole":"COORDINATOR","actorData":{"id":"COORD-01","name":"Dr. Tanmay Roy","title":"Project Coordinator"}}')
          DEPT_STATE=$(echo "$DEPT_PROP" | grep -o '"state":"[^"]*' | head -1 | cut -d'"' -f4)
          if [ "$DEPT_STATE" != "UNDER_GUIDE_REVIEW" ]; then
            echo "Expected Departmental request to start in UNDER_GUIDE_REVIEW, but got $DEPT_STATE!"
            exit 1
          fi
          echo "Departmental request created by Coordinator correctly initialized in UNDER_GUIDE_REVIEW."

          echo "============================================================================"
          echo "11. Case-Insensitive Workflow ID Resolution & Tracking Verification..."
          echo "============================================================================"
          LOWER_WF_ID=$(echo "$NEG_WF_ID" | tr '[:upper:]' '[:lower:]')
          CASE_RES=$(curl -s "http://localhost:8080/api/workflows/$LOWER_WF_ID")
          echo "$CASE_RES" | grep -q '"success":true'
          echo "$CASE_RES" | grep -q "$NEG_WF_ID"
          echo "Case-insensitive lookup for lowercase ID '$LOWER_WF_ID' successfully resolved to '$NEG_WF_ID'."

          echo "============================================================================"
          echo "12. Executing Automated Multi-Path End-to-End Test Suite in Node..."
          echo "============================================================================"
          node server/scripts/testAllWorkflowPaths.js

          echo "============================================================================"
          echo "✨ COMPLETE DYNAMIC ZERO-SAMPLE-DATA E2E PIPELINE PASSED SUCCESSFULLY!"
          echo "============================================================================"

      - name: Inspect Container Logs & Teardown
        if: always()
        run: |
          docker compose logs
          docker compose down
